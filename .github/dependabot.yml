# Dependabot configuration

version: 2
updates:
  # Tự động cập nhật GitHub Actions trên nhánh main
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'daily'
    labels:
      - 'phụ thuộc'
    commit-message:
      prefix: 'chore(deps):'
    open-pull-requests-limit: 10
