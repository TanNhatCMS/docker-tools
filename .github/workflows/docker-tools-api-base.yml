name: Docker Tools API Base Build

on:
  repository_dispatch:
    types: [trigger-api-base-build]

concurrency:
  group: docker-tools-api-base-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: tannhatcms
  PUBLIC_REPO: docker-tools-api-base

permissions:
  contents: read
  packages: write

jobs:
  build-base-api:
    name: Build & Push API Base
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      base_image_tag: ${{ steps.calc.outputs.tag }}
      base_image_latest: ${{ steps.calc.outputs.latest }}
      skipped: ${{ steps.check.outputs.exists }}

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4
        with:
          repository: TanNhatCMS/QuanLyCongViec
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
          token: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout exact commit SHA
        run: |
          git checkout ${{ github.event.client_payload.sha }}

      - name: Calculate tag
        id: calc
        run: |
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          HASH=$(cat Directory.Build.props Directory.Packages.props global.json | sha256sum | cut -d' ' -f1)
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-api-base"

          BRANCH="${{ github.event.client_payload.branch }}"
          if [ "$BRANCH" = "main" ]; then
            PREFIX=""
            SUFFIX=""
          else
            PREFIX="${BRANCH}-"
            SUFFIX="-${BRANCH}"
          fi

          COMMIT_SHA=$(echo "${{ github.event.client_payload.sha }}" | cut -c1-7)
          TAG="${IMAGE_NAME}:${PREFIX}deps-${HASH}"
          VERSION_TAG="${IMAGE_NAME}:v${VERSION}${SUFFIX}"
          SHA_TAG="${IMAGE_NAME}:v${VERSION}${SUFFIX}-sha-${COMMIT_SHA}"
          LATEST="${IMAGE_NAME}:latest${SUFFIX}"

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "tag: $TAG"
          echo "version_tag: $VERSION_TAG"
          echo "sha_tag: $SHA_TAG"
          echo "latest: $LATEST"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Check existing
        id: check
        run: |
          if [ "${{ github.event.client_payload.force_rebuild }}" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "force rebuild"
          elif docker manifest inspect "${{ steps.calc.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "will build"
          fi

          if docker manifest inspect "${{ steps.calc.outputs.latest }}" >/dev/null 2>&1; then
            echo "use_registry_cache=true" >> $GITHUB_OUTPUT
            echo "using latest as registry cache"
          else
            echo "use_registry_cache=false" >> $GITHUB_OUTPUT
            echo "no registry cache"
          fi

      - name: Set up Buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Build & push
        id: build
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        continue-on-error: true
        with:
          context: .
          file: docker/dotnet/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.calc.outputs.tag }}
            ${{ steps.calc.outputs.version_tag }}
            ${{ steps.calc.outputs.sha_tag }}
            ${{ steps.calc.outputs.latest }}
          cache-from: |
            type=registry,ref=${{ steps.calc.outputs.latest }}
            type=gha,scope=api-base
          cache-to: type=gha,mode=max,scope=api-base
          provenance: false
          sbom: false

      - name: Retry build if failed
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/dotnet/Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.calc.outputs.tag }}
            ${{ steps.calc.outputs.version_tag }}
            ${{ steps.calc.outputs.sha_tag }}
            ${{ steps.calc.outputs.latest }}
          cache-from: |
            type=registry,ref=${{ steps.calc.outputs.latest }}
            type=gha,scope=api-base
          cache-to: type=gha,mode=max,scope=api-base
          provenance: false
          sbom: false

      - name: Summary
        run: |
          echo "## 📦 docker-tools API base" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${{ steps.calc.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ steps.calc.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version Tag:** \`${{ steps.calc.outputs.version_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA Tag:** \`${{ steps.calc.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest:** \`${{ steps.calc.outputs.latest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hash:** \`${{ steps.calc.outputs.hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "- **Status:** cached (skipped)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** built & pushed" >> "$GITHUB_STEP_SUMMARY"
          fi
