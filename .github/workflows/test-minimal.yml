name: Test Minimal
run-name: "Test Minimal · ${{ github.sha }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
      source_repository:
        type: string
        required: false
        default: ''
      pr_number:
        type: string
        required: false
        default: ''
      comment_id:
        type: string
        required: false
        default: ''
      caller_run_url:
        type: string
        required: false
        default: ''
      trigger:
        type: string
        required: false
        default: 'workflow_call'
      coverage_gist_id:
        type: string
        required: false
        default: ''
    secrets: {}
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
      - run: echo "minimal test — source=${{ inputs.source_repository }} ref=${{ inputs.ref }}"
