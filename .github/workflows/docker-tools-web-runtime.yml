name: Docker Tools Web Runtime Build

on:
  repository_dispatch:
    types: [trigger-web-runtime-build]

concurrency:
  group: docker-tools-web-runtime-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: tannhatcms
  PUBLIC_REPO: docker-tools-web-runtime

permissions:
  contents: read
  packages: write

jobs:
  build-base-web-runtime:
    name: Build & Push Web Runtime Base
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v6
        with:
          repository: TanNhatCMS/QuanLyCongViec
          ref: ${{ github.event.client_payload.branch }}
          fetch-depth: 0
          token: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout exact commit SHA
        run: |
          git checkout ${{ github.event.client_payload.sha }}

      - name: Resolve lane tags
        id: tags
        run: |
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          HASH=$(sha256sum docker/nextjs/Dockerfile.runtime.base | cut -d' ' -f1)
          
          BRANCH="${{ github.event.client_payload.branch }}"
          IMAGE_NAME="${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web-runtime-base"
          if [ "$BRANCH" = "main" ]; then
            PREFIX=""
            SUFFIX=""
          else
            PREFIX="${BRANCH}-"
            SUFFIX="-${BRANCH}"
          fi
          
          COMMIT_SHA=$(echo "${{ github.event.client_payload.sha }}" | cut -c1-7)
          TAG="${IMAGE_NAME}:${PREFIX}deps-${HASH}"
          VERSION_TAG="${IMAGE_NAME}:v${VERSION}${SUFFIX}"
          SHA_TAG="${IMAGE_NAME}:v${VERSION}${SUFFIX}-sha-${COMMIT_SHA}"
          LATEST="${IMAGE_NAME}:latest${SUFFIX}"
          
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "hash=${HASH}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH, tags: ${TAG}, ${VERSION_TAG}, ${SHA_TAG}, ${LATEST}"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push Runtime base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/nextjs/Dockerfile.runtime.base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.tag }}
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.version_tag }}
            ${{ steps.tags.outputs.sha_tag }}
          cache-from: |
            type=registry,ref=${{ steps.tags.outputs.latest }}
            type=gha,scope=web-runtime
          cache-to: type=gha,mode=max,scope=web-runtime
          provenance: false
          sbom: false

      - name: Summary
        run: |
          echo "## 🌐 Web Runtime Base Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version:** \`${{ steps.tags.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image:** \`${{ steps.tags.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version Tag:** \`${{ steps.tags.outputs.version_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SHA Tag:** \`${{ steps.tags.outputs.sha_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest:** \`${{ steps.tags.outputs.latest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Hash:** \`${{ steps.tags.outputs.hash }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status:** built & pushed" >> "$GITHUB_STEP_SUMMARY"
