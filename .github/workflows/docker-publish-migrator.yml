name: Docker Publish Migrator Build

on:
  repository_dispatch:
    types: [trigger-publish-migrator]

concurrency:
  group: docker-publish-migrator-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: tannhatcms
  IMAGE_NAME: qlcv-db-migrator

permissions:
  contents: read
  packages: write

jobs:
  build-migrator:
    name: Build & Push DB Migrator
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v7
        with:
          repository: TanNhatCMS/QuanLyCongViec
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
          token: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          submodules: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            VERSION="${{ github.event.client_payload.version }}"
            echo "Source: client_payload"
          else
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "dev")
            echo "Source: package.json"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event.client_payload.branch == 'main' }}
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN }}

      - name: Build and push migrator image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/db-migrator/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}:latest
            type=gha,scope=publish-migrator
          cache-to: type=gha,mode=max,scope=publish-migrator
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}

      - name: Summary
        run: |
          echo "## 🐳 DB Migrator Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.IMAGE_NAME }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
