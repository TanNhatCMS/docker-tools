name: Test API (.NET)
# Reusable workflow — được caller (phu-nam-hai-jsco/task-manager) gọi qua `uses:`.
# run-name: workflow gọi · repo gọi · PR/ref · trigger — nhìn là biết nguồn chạy.
run-name: "${{ github.workflow }} · ${{ github.repository }} · ${{ inputs.pr_number != '' && format('PR #{0}', inputs.pr_number) || github.head_ref || github.ref_name }} · ${{ inputs.trigger }}"

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref of the caller repo to checkout/test/build'
        type: string
        required: false
        default: ''
      pr_number:
        description: 'PR number for report/comment flows'
        type: string
        required: false
        default: ''
      comment_id:
        description: 'Command comment id for $test-* flows'
        type: string
        required: false
        default: ''
      trigger:
        description: 'Human-readable trigger label'
        type: string
        required: false
        default: 'workflow_call'
      caller_run_url:
        description: 'Caller workflow run URL (shown in the report footer)'
        type: string
        required: false
        default: ''
      coverage_gist_id:
        description: 'Gist id để cập nhật badge coverage (chỉ chạy trên main)'
        type: string
        required: false
        default: ''
    secrets:
      SUBMODULE_TOKEN:
        description: 'PAT with repo scope to checkout private submodules + main repo'
        required: false
      MAIN_REPO_PR_TOKEN:
        description: 'Optional PAT (contents:write + statuses:write trên caller repo) để set commit status / gửi báo cáo test-report'
        required: false
      MAIN_REPO_CHECKOUT_TOKEN:
        description: 'Optional PAT fallback cho checkout'
        required: false
      GIST_TOKEN:
        description: 'Optional PAT để cập nhật badge coverage (gist)'
        required: false

concurrency:
  group: test-dotnet-${{ inputs.pr_number || inputs.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Caller repo context (reusable workflow chạy với context của caller)
  MAIN_REPO: ${{ github.repository }}
  STATUS_CONTEXT: .NET Test
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HAS_GIST_TOKEN: ${{ secrets.GIST_TOKEN != '' }}

    steps:
      - name: Set pending status on caller repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f target_url="$RUN_URL" \
            -f description="Build & Test in progress..." -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set pending status trên $MAIN_REPO@$HEAD_SHA"

      # Lệnh từ comment `$test-*`: báo caller repo đã bắt đầu chạy → test-report.yml thả 🚀
      - name: Notify started
        if: env.PR_NUMBER != '' && inputs.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
        with:
          github-token: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'started',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID,
                header: 'dotnet-coverage',
                run_url: process.env.RUN_URL,
              },
            });

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          token: ${{ secrets.SUBMODULE_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN || github.token }}
          submodules: recursive

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        id: restore
        working-directory: server
        run: dotnet restore

      - name: Build
        id: build
        working-directory: server
        run: dotnet build --no-restore --configuration Release

      - name: Run tests
        id: tests
        working-directory: server
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Merge coverage reports
        id: merge
        working-directory: server
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:"coverage/merged" -reporttypes:"Cobertura"

      - name: Code Coverage Summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: server/coverage/merged/Cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '50 75'

      - name: Extract coverage percentage
        id: coverage
        working-directory: server
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage/merged/Cobertura.xml | head -1)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc | xargs printf "%.1f")
          echo "percentage=${COVERAGE_PCT}" >> $GITHUB_OUTPUT
          echo "Dotnet Coverage: ${COVERAGE_PCT}%"

      - name: Update coverage badge (Gist)
        if: inputs.ref == 'main' && inputs.coverage_gist_id != '' && env.HAS_GIST_TOKEN == 'true'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ inputs.coverage_gist_id }}
          filename: dotnet-coverage.json
          label: Dotnet coverage
          message: '${{ steps.coverage.outputs.percentage }}%'
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/*.trx'
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: server/coverage/merged/Cobertura.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Build PR report
        if: always() && env.PR_NUMBER != ''
        env:
          JOB_STATUS: ${{ job.status }}
          TRIGGER: ${{ inputs.trigger }}
          CALLER_RUN_URL: ${{ inputs.caller_run_url }}
          RESTORE: ${{ steps.restore.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          [ "$JOB_STATUS" = "success" ] && RESULT="✅ Passed" || RESULT="❌ $JOB_STATUS"
          {
            echo "## 🧪 .NET Test — $RESULT"
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Restore | $(icon "$RESTORE") |"
            echo "| Build | $(icon "$BUILD") |"
            echo "| Tests | $(icon "$TESTS") |"
            echo
            if [ -f code-coverage-results.md ]; then
              sed 's/Code Coverage/Dotnet Coverage/g' code-coverage-results.md
              echo
            fi
            CALLER=""
            [ -n "$CALLER_RUN_URL" ] && CALLER=" · [caller run](${CALLER_RUN_URL})"
            echo "<sub>🔗 [workflow run #${GITHUB_RUN_NUMBER}](${RUN_URL})${CALLER} · commit ${HEAD_SHA} · trigger: ${TRIGGER} · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > pr-report.md

      - name: Set final status on caller repo commit
        if: always() && env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f target_url="$RUN_URL" \
            -f description="$STATUS_CONTEXT $STATE" -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set final status trên $MAIN_REPO@$HEAD_SHA"

      # Không comment trực tiếp bằng PAT (comment sẽ mang tên user → ci-dispatcher coi là người).
      # Gửi báo cáo về caller repo qua createDispatchEvent 'test-report'; workflow test-report.yml
      # ở caller repo đăng comment (sticky, hoặc quote-reply comment lệnh) + thả 👍/👎 bằng GITHUB_TOKEN
      # (github-actions[bot]).
      - name: Send report to caller repo
        if: always() && env.PR_NUMBER != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ inputs.comment_id }}
          CONCLUSION: ${{ job.status }}
        with:
          github-token: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          script: |
            const fs = require('fs');
            let body = fs.existsSync('pr-report.md') ? fs.readFileSync('pr-report.md', 'utf8') : '';
            if (!body) body = `## 🧪 dotnet-coverage — ❌ ${process.env.CONCLUSION}\n\nKhông tạo được báo cáo: ${process.env.RUN_URL}`;
            // Dispatch event giới hạn kích thước payload → cắt bớt báo cáo quá dài
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…(báo cáo bị cắt, xem đầy đủ tại run)';
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'test-report',
              client_payload: {
                stage: 'completed',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID || '',
                header: 'dotnet-coverage',
                conclusion: process.env.CONCLUSION,
                run_url: process.env.RUN_URL,
                body,
              },
            });

            // Summary: link bấm được tới PR và thẳng tới comment lệnh
            const prUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${process.env.PR_NUMBER}`;
            const rows = [
              [{ data: 'PR', header: true }, { data: 'Comment lệnh', header: true }, { data: 'Kết quả', header: true }],
              [
                `<a href="${prUrl}">${context.repo.owner}/${context.repo.repo}#${process.env.PR_NUMBER}</a>`,
                process.env.COMMENT_ID
                  ? `<a href="${prUrl}#issuecomment-${process.env.COMMENT_ID}">#issuecomment-${process.env.COMMENT_ID}</a>`
                  : '— (chạy tự động, sticky comment)',
                process.env.CONCLUSION,
              ],
            ];
            await core.summary.addHeading(`🧪 Test report → ${context.repo.repo}`, 3).addTable(rows).write();
            core.info(`Report sent to ${context.repo.owner}/${context.repo.repo} (PR #${process.env.PR_NUMBER}, ${process.env.CONCLUSION})`);
