name: Test Desktop (Rust)
# run-name chứa dispatch_id để workflow phía main repo tìm đúng run vừa được kích hoạt
run-name: "Test Desktop · PR #${{ github.event.client_payload.pr_number || '-' }} · ${{ github.event.client_payload.dispatch_id }}"

on:
  repository_dispatch:
    types: [trigger-test-app]

concurrency:
  group: test-desktop-${{ github.event.client_payload.pr_number || github.event.client_payload.branch }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAIN_REPO: TanNhatCMS/QuanLyCongViec
  STATUS_CONTEXT: Desktop Test
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTFLAGS: '-D warnings'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      HEAD_SHA: ${{ github.event.client_payload.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      HAS_GIST_TOKEN: ${{ secrets.GIST_TOKEN != '' }}
      # Coverage chỉ cần khi có PR để comment, hoặc khi chạy trên main để cập nhật badge
      WITH_COVERAGE: ${{ github.event.client_payload.pr_number != '' || github.event.client_payload.branch == 'main' }}

    steps:
      - name: Set pending status on main repo commit
        if: env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state=pending -f target_url="$RUN_URL" \
            -f description="Run Tests in progress..." -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set pending status trên $MAIN_REPO@$HEAD_SHA"

      # Lệnh từ comment `$test-*`: báo main repo docker-tools đã bắt đầu chạy → test-report.yml thả 🚀
      - name: Notify started
        if: env.PR_NUMBER != '' && github.event.client_payload.comment_id != ''
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ github.event.client_payload.comment_id }}
        with:
          github-token: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'TanNhatCMS',
              repo: 'QuanLyCongViec',
              event_type: 'test-report',
              client_payload: {
                stage: 'started',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID,
                header: 'desktop-coverage',
                run_url: process.env.RUN_URL,
              },
            });

      - name: Checkout Main Repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.MAIN_REPO }}
          ref: ${{ github.event.client_payload.sha || github.event.client_payload.branch }}
          fetch-depth: 1
          token: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          submodules: true

      - name: Install system dependencies (Linux / Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Build frontend static export
        id: build_ui
        run: bun run build:tauri-ui

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        if: env.WITH_COVERAGE == 'true'
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo registry & build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            artifacts/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('apps/desktop/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        id: tests
        if: env.WITH_COVERAGE != 'true'
        env:
          RUSTFLAGS: ''
        run: cargo test --manifest-path apps/desktop/Cargo.toml --all-features

      - name: Run tests with coverage
        id: tests_cov
        if: env.WITH_COVERAGE == 'true'
        env:
          RUSTFLAGS: ''
        run: |
          mkdir -p coverage
          cargo llvm-cov --manifest-path apps/desktop/Cargo.toml --all-features --cobertura --output-path coverage/desktop-coverage.xml

      - name: Code Coverage Summary
        if: env.WITH_COVERAGE == 'true'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/desktop-coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '50 75'

      - name: Extract coverage percentage
        id: coverage
        if: env.WITH_COVERAGE == 'true'
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' coverage/desktop-coverage.xml | head -1)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc | xargs printf "%.1f")
          echo "percentage=${COVERAGE_PCT}" >> $GITHUB_OUTPUT
          echo "Desktop Coverage: ${COVERAGE_PCT}%"

      - name: Update coverage badge (Gist)
        if: github.event.client_payload.branch == 'main' && github.event.client_payload.coverage_gist_id != '' && env.HAS_GIST_TOKEN == 'true'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ github.event.client_payload.coverage_gist_id }}
          filename: desktop-coverage.json
          label: Desktop coverage
          message: '${{ steps.coverage.outputs.percentage }}%'
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

      - name: Upload coverage reports
        if: always() && env.WITH_COVERAGE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-coverage-reports
          path: coverage/desktop-coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Build PR report
        if: always() && env.PR_NUMBER != ''
        env:
          JOB_STATUS: ${{ job.status }}
          TRIGGER: ${{ github.event.client_payload.trigger || 'repository_dispatch' }}
          CALLER_RUN_URL: ${{ github.event.client_payload.caller_run_url }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD_UI: ${{ steps.build_ui.outcome }}
          TESTS: ${{ steps.tests_cov.outcome }}
        run: |
          icon() { case "$1" in success) echo "✅ Passed";; failure) echo "❌ Failed";; cancelled) echo "🚫 Cancelled";; *) echo "⏭️ Skipped";; esac; }
          [ "$JOB_STATUS" = "success" ] && RESULT="✅ Passed" || RESULT="❌ $JOB_STATUS"
          {
            echo "## 🧪 Desktop Test — $RESULT"
            echo
            echo "| Step | Result |"
            echo "|------|--------|"
            echo "| Install dependencies | $(icon "$INSTALL") |"
            echo "| Build Tauri UI | $(icon "$BUILD_UI") |"
            echo "| Cargo test (llvm-cov) | $(icon "$TESTS") |"
            echo
            if [ -f code-coverage-results.md ]; then
              sed 's/Code Coverage/Desktop Coverage/g' code-coverage-results.md
              echo
            fi
            CALLER=""
            [ -n "$CALLER_RUN_URL" ] && CALLER=" · [caller run](${CALLER_RUN_URL})"
            echo "<sub>🔗 [docker-tools run #${GITHUB_RUN_NUMBER}](${RUN_URL})${CALLER} · commit ${HEAD_SHA} · trigger: ${TRIGGER} · $(date -u '+%Y-%m-%d %H:%M UTC')</sub>"
          } > pr-report.md

      - name: Set final status on main repo commit
        if: always() && env.HEAD_SHA != ''
        env:
          GH_TOKEN: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api "repos/$MAIN_REPO/statuses/$HEAD_SHA" \
            -f state="$STATE" -f target_url="$RUN_URL" \
            -f description="$STATUS_CONTEXT $STATE" -f context="$STATUS_CONTEXT" --silent \
            || echo "::warning::Không thể set final status trên $MAIN_REPO@$HEAD_SHA"

      # Không comment trực tiếp bằng PAT (comment sẽ mang tên user → ci-dispatcher coi là người).
      # Gửi báo cáo về main repo (repository_dispatch 'test-report'); workflow test-report.yml ở đó
      # đăng comment (sticky, hoặc quote-reply comment lệnh) + thả 👍/👎 bằng GITHUB_TOKEN (github-actions[bot]).
      - name: Send report to main repo
        if: always() && env.PR_NUMBER != ''
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ github.event.client_payload.comment_id }}
          CONCLUSION: ${{ job.status }}
        with:
          github-token: ${{ secrets.MAIN_REPO_PR_TOKEN || secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          script: |
            const fs = require('fs');
            let body = fs.existsSync('pr-report.md') ? fs.readFileSync('pr-report.md', 'utf8') : '';
            if (!body) body = `## 🧪 desktop-coverage — ❌ ${process.env.CONCLUSION}\n\nKhông tạo được báo cáo: ${process.env.RUN_URL}`;
            // repository_dispatch giới hạn kích thước payload → cắt bớt báo cáo quá dài
            if (body.length > 60000) body = body.slice(0, 60000) + '\n\n…(báo cáo bị cắt, xem đầy đủ tại run)';
            await github.rest.repos.createDispatchEvent({
              owner: 'TanNhatCMS',
              repo: 'QuanLyCongViec',
              event_type: 'test-report',
              client_payload: {
                stage: 'completed',
                pr_number: process.env.PR_NUMBER,
                comment_id: process.env.COMMENT_ID || '',
                header: 'desktop-coverage',
                conclusion: process.env.CONCLUSION,
                run_url: process.env.RUN_URL,
                body,
              },
            });

            // Summary: link bấm được tới PR và thẳng tới comment lệnh
            const prUrl = `https://github.com/TanNhatCMS/QuanLyCongViec/pull/${process.env.PR_NUMBER}`;
            const rows = [
              [{ data: 'PR', header: true }, { data: 'Comment lệnh', header: true }, { data: 'Kết quả', header: true }],
              [
                `<a href="${prUrl}">TanNhatCMS/QuanLyCongViec#${process.env.PR_NUMBER}</a>`,
                process.env.COMMENT_ID
                  ? `<a href="${prUrl}#issuecomment-${process.env.COMMENT_ID}">#issuecomment-${process.env.COMMENT_ID}</a>`
                  : '— (chạy tự động, sticky comment)',
                process.env.CONCLUSION,
              ],
            ];
            await core.summary.addHeading('🧪 Test report → QuanLyCongViec', 3).addTable(rows).write();
            core.info(`Report sent to TanNhatCMS/QuanLyCongViec (PR #${process.env.PR_NUMBER}, ${process.env.CONCLUSION})`);
