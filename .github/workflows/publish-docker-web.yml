name: Docker Publish Web Build

on:
  repository_dispatch:
    types: [trigger-publish-web]

concurrency:
  group: publish-docker-web-${{ github.event.client_payload.branch }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  OWNER: tannhatcms

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    name: Build & Push Web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v7
        with:
          repository: TanNhatCMS/QuanLyCongViec
          ref: ${{ github.event.client_payload.sha }}
          fetch-depth: 0
          token: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN }}
          submodules: true

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.client_payload.version }}" ]; then
            VERSION="${{ github.event.client_payload.version }}"
            echo "Source: client_payload"
          else
            VERSION=$(node -p "require('./package.json').version" 2>/dev/null || echo "dev")
            echo "Source: package.json"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved version: $VERSION"

      - name: Resolve lane prefix
        id: lane
        run: |
          BRANCH="${{ github.event.client_payload.branch }}"
          if [ "$BRANCH" = "main" ]; then
            echo "prefix=" >> $GITHUB_OUTPUT
            echo "suffix=" >> $GITHUB_OUTPUT
            echo "base_image=${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web-base:latest" >> $GITHUB_OUTPUT
            echo "runtime_base_image=${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web-runtime-base:latest" >> $GITHUB_OUTPUT
          else
            echo "prefix=${BRANCH}-" >> $GITHUB_OUTPUT
            echo "suffix=-${BRANCH}" >> $GITHUB_OUTPUT
            echo "base_image=${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web-base:latest-${BRANCH}" >> $GITHUB_OUTPUT
            echo "runtime_base_image=${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web-runtime-base:latest-${BRANCH}" >> $GITHUB_OUTPUT
          fi
          echo "Branch: $BRANCH"

      - name: Parse env_json
        id: env_json
        run: |
          ENV_JSON='${{ github.event.client_payload.env_json }}'
          if [ -n "$ENV_JSON" ]; then
            echo "build_env=$(echo "$ENV_JSON" | jq -r '.BUILD_ENV // "production"')" >> $GITHUB_OUTPUT
            echo "next_public_api_base_url=$(echo "$ENV_JSON" | jq -r '.NEXT_PUBLIC_API_BASE_URL // ""')" >> $GITHUB_OUTPUT
            echo "internal_api_base_url=$(echo "$ENV_JSON" | jq -r '.INTERNAL_API_BASE_URL // ""')" >> $GITHUB_OUTPUT
            echo "next_public_debug=$(echo "$ENV_JSON" | jq -r '.NEXT_PUBLIC_DEBUG // "false"')" >> $GITHUB_OUTPUT
            echo "next_public_ag_grid_license=$(echo "$ENV_JSON" | jq -r '.NEXT_PUBLIC_AG_GRID_LICENSE // ""')" >> $GITHUB_OUTPUT
            echo "node_options=$(echo "$ENV_JSON" | jq -r '.NODE_OPTIONS // "--max-old-space-size=512"')" >> $GITHUB_OUTPUT
            echo "sentry_dsn_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_DSN_WEB // ""')" >> $GITHUB_OUTPUT
            echo "sentry_traces_sample_rate_web_client=$(echo "$ENV_JSON" | jq -r '.SENTRY_TRACES_SAMPLE_RATE_WEB_CLIENT // "0.2"')" >> $GITHUB_OUTPUT
            echo "sentry_replay_session_sample_rate_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_REPLAY_SESSION_SAMPLE_RATE_WEB // "0.05"')" >> $GITHUB_OUTPUT
            echo "sentry_replay_on_error_sample_rate_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE_WEB // "1.0"')" >> $GITHUB_OUTPUT
            echo "sentry_obs_api_token=$(echo "$ENV_JSON" | jq -r '.SENTRY_OBS_API_TOKEN // ""')" >> $GITHUB_OUTPUT
            echo "sentry_obs_organization_slug=$(echo "$ENV_JSON" | jq -r '.SENTRY_OBS_ORGANIZATION_SLUG // ""')" >> $GITHUB_OUTPUT
            echo "sentry_obs_project_web=$(echo "$ENV_JSON" | jq -r '.SENTRY_OBS_PROJECT_WEB // "web"')" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.OWNER }}
          password: ${{ secrets.MAIN_REPO_CHECKOUT_TOKEN }}

      - name: Pull base images for caching
        run: |
          docker pull ${{ steps.lane.outputs.base_image }} || true
          docker pull ${{ steps.lane.outputs.runtime_base_image }} || true

      - name: Extract Base Image Digest
        id: base_digest
        run: |
          RAW_DIGEST=$(docker image inspect ${{ steps.lane.outputs.base_image }} 2>/dev/null | jq -r '.[0].RepoDigests[0] // .[0].Id' 2>/dev/null || echo "")
          DIGEST=${RAW_DIGEST#*sha256:}
          DIGEST=${DIGEST:0:7}
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then DIGEST="unknown"; fi
          echo "Base Digest: $DIGEST"
          echo "short=${DIGEST}" >> $GITHUB_OUTPUT

          RAW_RT=$(docker image inspect ${{ steps.lane.outputs.runtime_base_image }} 2>/dev/null | jq -r '.[0].RepoDigests[0] // .[0].Id' 2>/dev/null || echo "")
          RT_DIGEST=${RAW_RT#*sha256:}
          RT_DIGEST=${RT_DIGEST:0:7}
          if [ -z "$RT_DIGEST" ] || [ "$RT_DIGEST" = "null" ]; then RT_DIGEST="unknown"; fi
          echo "Runtime Digest: $RT_DIGEST"
          echo "rt_short=${RT_DIGEST}" >> $GITHUB_OUTPUT
      - name: Decrypt Secrets
        id: decrypt
        env:
          ENCRYPTED_PAYLOAD: ${{ github.event.client_payload.encrypted_payload }}
          PAYLOAD_ENCRYPTION_KEY: ${{ secrets.PAYLOAD_ENCRYPTION_KEY }}
        run: |
          if [ -n "$ENCRYPTED_PAYLOAD" ]; then
            echo "$ENCRYPTED_PAYLOAD" | base64 -d | openssl enc -d -aes-256-cbc -salt -pbkdf2 -pass pass:$PAYLOAD_ENCRYPTION_KEY -out decrypted.json
            
            AG_GRID=$(jq -r '.ag_grid_license // empty' decrypted.json)
            SENTRY=$(jq -r '.sentry_obs_api_token // empty' decrypted.json)
            [ -n "$AG_GRID" ] && echo "::add-mask::$AG_GRID"
            [ -n "$SENTRY" ] && echo "::add-mask::$SENTRY"
            echo "ag_grid_license=$AG_GRID" >> $GITHUB_OUTPUT
            echo "sentry_obs_api_token=$SENTRY" >> $GITHUB_OUTPUT
          fi

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest${{ steps.lane.outputs.suffix }}
            type=raw,value=${{ steps.version.outputs.version }}${{ steps.lane.outputs.suffix }}
            type=raw,value=${{ steps.version.outputs.version }}${{ steps.lane.outputs.suffix }}-base-${{ steps.base_digest.outputs.short }}-rt-${{ steps.base_digest.outputs.rt_short }}
            type=sha,prefix=${{ steps.lane.outputs.prefix }}sha-,format=short

      - name: Build and push Web image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/nextjs/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web:latest${{ steps.lane.outputs.suffix }}
            type=gha,scope=publish-web
          cache-to: type=gha,mode=max,scope=publish-web
          provenance: false
          sbom: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BASE_IMAGE=${{ steps.lane.outputs.base_image }}
            RUNTIME_BASE_IMAGE=${{ steps.lane.outputs.runtime_base_image }}
            BUILD_ENV=${{ steps.env_json.outputs.build_env }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.env_json.outputs.next_public_api_base_url }}
            INTERNAL_API_BASE_URL=${{ steps.env_json.outputs.internal_api_base_url }}
            NEXT_PUBLIC_DEBUG=${{ steps.env_json.outputs.next_public_debug }}
            NEXT_PUBLIC_AG_GRID_LICENSE=${{ steps.decrypt.outputs.ag_grid_license }}
            NODE_OPTIONS=${{ steps.env_json.outputs.node_options }}
            SENTRY_DSN_WEB=${{ steps.env_json.outputs.sentry_dsn_web }}
            SENTRY_TRACES_SAMPLE_RATE_WEB_CLIENT=${{ steps.env_json.outputs.sentry_traces_sample_rate_web_client }}
            SENTRY_REPLAY_SESSION_SAMPLE_RATE_WEB=${{ steps.env_json.outputs.sentry_replay_session_sample_rate_web }}
            SENTRY_REPLAY_ON_ERROR_SAMPLE_RATE_WEB=${{ steps.env_json.outputs.sentry_replay_on_error_sample_rate_web }}
            SENTRY_OBS_API_TOKEN=${{ steps.decrypt.outputs.sentry_obs_api_token }}
            SENTRY_OBS_ORGANIZATION_SLUG=${{ steps.env_json.outputs.sentry_obs_organization_slug }}
            SENTRY_OBS_PROJECT_WEB=${{ steps.env_json.outputs.sentry_obs_project_web }}

      - name: Summary
        run: |
          echo "## 🌐 Web Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.OWNER }}/qlcv-web\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.event.client_payload.branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base Digest:** \`${{ steps.base_digest.outputs.short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Runtime Digest:** \`${{ steps.base_digest.outputs.rt_short }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Tags" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
